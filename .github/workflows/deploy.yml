# Deploys main to the university's KENET VMs once CI has passed on it: the web image is built,
# tagged with the commit and pushed to ghcr.io, then /opt/nextup/deploy.sh on vm-app (the only
# command the deploy key may run) pulls it, restarts attendance-web and checks it comes up, else
# puts the previous image back. Needs the `kenet` environment's KENET_DEPLOY_KEY and
# KENET_KNOWN_HOSTS (setup-ci.sh in the deploy kit). Run it by hand to redeploy a commit.
name: Deploy to KENET

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kenet-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REGISTRY: ghcr.io/kim-254-de
  VM_APP: 197.137.65.49

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - name: Build and push nextup-attendance-web
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="$REGISTRY/nextup-attendance-web:$SHA"
          docker build --pull -t "$image" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$SHA" .
          docker push "$image"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: kenet
    permissions: { packages: read }
    steps:
      - name: Deploy attendance-web
        env:
          KEY: ${{ secrets.KENET_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KENET_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30 "user@$VM_APP" "deploy attendance-web $SHA"
